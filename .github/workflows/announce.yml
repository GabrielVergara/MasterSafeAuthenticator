name: announce

# Announces a published release on Mastodon and Bluesky (scripts/announce.py). A service is skipped when its secrets are
# not set, so this is harmless until the accounts exist. Secrets: BLUESKY_HANDLE, BLUESKY_APP_PASSWORD, MASTODON_URL, MASTODON_TOKEN.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to announce, for example 1.7.2'
        required: true
      services:
        description: 'Where to post when run by hand: all, bluesky or mastodon'
        type: choice
        options: [all, bluesky, mastodon]
        default: all
      dry_run:
        description: 'Only print the posts'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  announce:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || !github.event.release.prerelease
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Announce
        env:
          INPUT: ${{ github.event.inputs.version }}
          TAG: ${{ github.event.release.tag_name }}
          DRY: ${{ github.event.inputs.dry_run }}
          SERVICES: ${{ github.event.inputs.services }}
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_TOKEN: ${{ secrets.MASTODON_TOKEN }}
          BLUESKY_HANDLE: ${{ secrets.BLUESKY_HANDLE }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
        run: |
          version="${INPUT:-${TAG#v}}"
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then echo "Not a version: $version"; exit 1; fi
          if [ "$DRY" = "true" ]; then python3 scripts/announce.py "$version" --dry-run --only "${SERVICES:-all}"; else python3 scripts/announce.py "$version" --only "${SERVICES:-all}"; fi
