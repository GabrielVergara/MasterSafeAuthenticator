name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      # Fails when a package differs from the lock files. Refresh them with scripts/update-lock-files.ps1.
      - name: Restore
        run: dotnet restore MasterSafe.slnx --locked-mode -p:MasterSafeLockFiles=true

      - name: Build
        run: dotnet build MasterSafe.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MasterSafe.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Fail on known vulnerable packages
        shell: bash
        run: bash scripts/check-vulnerabilities.sh

      - name: Upload coverage
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-${{ matrix.os }}
          path: ./coverage
