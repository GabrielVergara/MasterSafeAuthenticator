name: build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    name: build-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MasterSafe.slnx

      - name: Build
        run: dotnet build MasterSafe.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MasterSafe.slnx --configuration Release --no-build --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Check for vulnerable packages
        run: dotnet list MasterSafe.slnx package --vulnerable --include-transitive

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: ./coverage
