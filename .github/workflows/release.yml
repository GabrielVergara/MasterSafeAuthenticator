name: release

# Run by pushing a tag such as v1.5.0. Builds and tests the Windows installer and the Linux packages, records where they
# came from (a signed build attestation), and creates a DRAFT release with the files.
#
# The release signing key is NOT in this workflow or anywhere on GitHub. The maintainer signs the draft on their own
# computer with scripts/sign-release.ps1, which first checks the attestation, then adds the ML-DSA-65 signatures and
# publishes. See docs/ReleaseProcess.md.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Fail on known vulnerable packages
        shell: bash
        run: bash scripts/check-vulnerabilities.sh

      - name: Test
        run: dotnet test MasterSafe.slnx --configuration Release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build installer
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          ./installer/build-windows.ps1 -Version $version

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows
          path: |
            artifacts/*-setup.exe
            artifacts/*-setup.exe.sha256
            artifacts/MasterSafe-Cli-*-win-x64.exe
            artifacts/MasterSafe-Cli-*-win-x64.exe.sha256

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6
        with:
          dotnet-version: '10.0.x'

      - name: Fail on known vulnerable packages
        run: bash scripts/check-vulnerabilities.sh

      - name: Test
        run: dotnet test MasterSafe.slnx --configuration Release

      - name: Build packages
        run: |
          version="${GITHUB_REF_NAME#v}"
          bash installer/linux/build-linux.sh "$version" linux-x64
          bash installer/linux/build-linux.sh "$version" linux-arm64

      - name: Software bill of materials
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX MasterSafe.slnx -o artifacts -fn sbom.cyclonedx.json --json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux
          path: |
            artifacts/*.tar.gz
            artifacts/*.tar.gz.sha256
            artifacts/MasterSafe-Cli-*-linux-*
            artifacts/sbom.cyclonedx.json

  publish:
    needs: [windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          merge-multiple: true

      - name: Record where the files came from
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-path: 'dist/*'

      - name: Create draft release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          draft: true
          generate_release_notes: true
          body: |
            **Draft: not signed yet.** The maintainer signs these files offline with `scripts/sign-release.ps1`
            (it checks the build attestation first) and then publishes. Check any download with the public key in
            `signing/` (see SECURITY.md).
          files: |
            dist/*
            signing/masterSafe-release.pub
