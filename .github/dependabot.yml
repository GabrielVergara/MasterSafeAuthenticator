# Keeps dependencies patched. Security updates for known vulnerabilities are opened as soon as an advisory is
# published (enable "Dependabot security updates" in the repository settings); the weekly runs below keep
# everything else current. Review and merge these pull requests promptly, then tag a new release.
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    # One pull request a week for every NuGet update: separate pull requests all touch the same lock files and conflict
    # once one is merged. dependabot-lock-files.yml refreshes the lock files on it and starts the build.
    groups:
      nuget:
        patterns: ["*"]
    commit-message:
      prefix: "deps"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
