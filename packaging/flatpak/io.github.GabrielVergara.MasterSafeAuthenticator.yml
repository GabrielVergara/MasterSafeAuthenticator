# Flatpak manifest for Flathub. It repackages the official signed Linux release (licence 1.2, section 3): the program files
# are exactly those of the release, checked by SHA-256. See docs/Distribution.md.
# The launcher, desktop entry, metainfo and icon come from the archive's flatpak/ folder (from 1.7.1), so a new version
# only changes the two URLs and checksums below; Flathub's data checker does that by itself.
# Local build: flatpak-builder --user --install --force-clean build-dir io.github.GabrielVergara.MasterSafeAuthenticator.yml
id: io.github.GabrielVergara.MasterSafeAuthenticator
runtime: org.freedesktop.Platform
runtime-version: '26.08'
sdk: org.freedesktop.Sdk
command: mastersafe
separate-locales: false
finish-args:
  # Avalonia draws through X11 (XWayland on a Wayland desktop).
  - --socket=x11
  - --share=ipc
  - --device=dri
  # Only for what the user turns on: the breach check, WebDAV sync, site icons, never for updates.
  - --share=network
  # The tray icon.
  - --talk-name=org.kde.StatusNotifierWatcher
  # No file system access: files are opened and saved through the desktop's file dialogs (portals).
modules:
  - name: mastersafe
    buildsystem: simple
    build-commands:
      - install -d /app/lib/mastersafe
      - cp -a app/. /app/lib/mastersafe/
      - chmod 0755 /app/lib/mastersafe/MasterSafe.App
      - install -Dm0755 flatpak/mastersafe.sh /app/bin/mastersafe
      - install -Dm0644 masterSafe-authenticator.png /app/share/icons/hicolor/256x256/apps/${FLATPAK_ID}.png
      - install -Dm0644 flatpak/logo.svg /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -Dm0644 flatpak/${FLATPAK_ID}.desktop /app/share/applications/${FLATPAK_ID}.desktop
      - install -Dm0644 flatpak/${FLATPAK_ID}.metainfo.xml /app/share/metainfo/${FLATPAK_ID}.metainfo.xml
      - install -Dm0644 LICENSE /app/share/licenses/${FLATPAK_ID}/LICENSE
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/GabrielVergara/MasterSafeAuthenticator/releases/download/v1.7.1/MasterSafe-Authenticator-1.7.1-linux-x64.tar.gz
        sha256: d126c0e7e5b55ed156a77fb033e16b97f5157e4507fb8a936596857f0ba7672d
        x-checker-data:
          type: json
          url: https://api.github.com/repos/GabrielVergara/MasterSafeAuthenticator/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/GabrielVergara/MasterSafeAuthenticator/releases/download/v" + $version + "/MasterSafe-Authenticator-" + $version + "-linux-x64.tar.gz"'
          is-main-source: true
      - type: archive
        only-arches: [aarch64]
        url: https://github.com/GabrielVergara/MasterSafeAuthenticator/releases/download/v1.7.1/MasterSafe-Authenticator-1.7.1-linux-arm64.tar.gz
        sha256: cebe17630c79fc2a4c45688ede37f88a555429fba92862736eda9e1dbd4470de
        x-checker-data:
          type: json
          url: https://api.github.com/repos/GabrielVergara/MasterSafeAuthenticator/releases/latest
          version-query: .tag_name | sub("^v"; "")
          url-query: '"https://github.com/GabrielVergara/MasterSafeAuthenticator/releases/download/v" + $version + "/MasterSafe-Authenticator-" + $version + "-linux-arm64.tar.gz"'
